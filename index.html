<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital@0;1&family=Open+Sans&display=swap"
    rel="stylesheet">
  <title>Zerando</title>
</head>
<body>
  <header>
    <img src="./images/plat.png" alt="Platinum Trophy"/>
    <h1>Zerando</h1>
  </header>
  <div class="container">
    <form id="contact-form">
      <h2>Name:</h2>
      <input type="text" id="contact-name" required placeholder="Ex: José Augusto" />
      <h2>WhatsApp (optional):</h2>
      <input type="tel" id="contact-number"/>
      <h2>Game:</h2>
      <input type="text" id="contact-game" required placeholder="Game Name" />
      <h2>Platinum? (Optional):</h2>
      <input type="text" id="contact-plat" required placeholder="No" />
      <h2>Hours:</h2>
      <input type="number" id="contact-hours" required placeholder="0" max="9999" />
    

      <button type="submit">Add</button>
    </form>
    <table id="contact-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>WhatsApp</th>
          <th>Game</th>
          <th>Platinum?</th>
          <th>Hours</th>
        </tr>
      </thead>
      <tbody>
        <!-- Os contatos serão inseridos aqui -->
      </tbody>
      <tfoot>
        <tr>
        </tr>
      </tfoot>
    </table>
  </div>
  <footer>
    &copy; 2024 - All Rights Reserved - Survivors
  </footer>
  <script src="/script.js"></script>
</body>
</html>
